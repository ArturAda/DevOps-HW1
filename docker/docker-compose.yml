services:
  app:
    image: nginx:alpine
    container_name: app_backend
    volumes:
      - ./html/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - compose_net

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./rev_proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - compose_net

networks:
  compose_net:
    driver: bridge
